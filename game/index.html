<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridgeline Courier — a bush-plane flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #7fb2e8; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Ridgeline Courier: fly the bush plane through golden rings and land on the mountain strip"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
